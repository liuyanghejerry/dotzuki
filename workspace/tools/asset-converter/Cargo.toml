[workspace]

[package]
name = "asset-converter"
version = "0.1.0"
edition = "2021"
description = "Convert Game Boy 2bpp tilesets to RGBA tilesets with Tiled .tsx output"

[dependencies]
clap = { version = "4", features = ["derive"] }
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
