[package]
name = "dotzuki-cli"
version.workspace = true
edition.workspace = true
description = "dotzuki CLI: scaffold (dotzuki new), compile-check (dotzuki check) and play (dotzuki run) zero-Rust JRPG projects"
license.workspace = true
repository.workspace = true

[[bin]]
name = "dotzuki"
path = "src/main.rs"

[dependencies]
dotzuki-engine-dsl = { path = "../dotzuki-engine-dsl", version = "0.1.0" }
dotzuki-runner = { path = "../dotzuki-runner", version = "0.1.0" }
dotzuki-rules = { path = "../dotzuki-rules", version = "0.1.0" }
dotzuki-app = { path = "../dotzuki-app", version = "0.1.0" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive"] }
