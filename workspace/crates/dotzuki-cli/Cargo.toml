[package]
name = "dotzuki-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "dotzuki"
path = "src/main.rs"

[dependencies]
dotzuki-engine-dsl = { path = "../dotzuki-engine-dsl" }
dotzuki-runner = { path = "../dotzuki-runner" }
dotzuki-rules = { path = "../dotzuki-rules" }
dotzuki-app = { path = "../dotzuki-app" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive"] }
