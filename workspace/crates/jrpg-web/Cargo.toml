[package]
name = "jrpg-web"
version.workspace = true
edition.workspace = true

# rlib is included alongside cdylib so the audio-render logic can be unit-tested
# natively (`cargo test -p jrpg-web`); wasm-pack still consumes the cdylib.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jrpg-renderer = { path = "../jrpg-renderer" }
jrpg-engine = { path = "../jrpg-engine" }
jrpg-ui = { path = "../jrpg-ui" }
jrpg-engine-dsl = { path = "../jrpg-engine-dsl" }
jrpg-audio = { path = "../jrpg-audio", features = ["serde"] }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = []
debug-panic-hook = ["dep:console_error_panic_hook"]
