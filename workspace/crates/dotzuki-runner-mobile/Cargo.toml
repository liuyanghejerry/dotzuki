[package]
name = "dotzuki-runner-mobile"
version.workspace = true
edition.workspace = true
description = "C ABI mobile host for the dotzuki zero-Rust game runner"
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
default = []
modern-audio = ["dotzuki-runner/modern-audio"]

[dependencies]
dotzuki-mobile = { path = "../dotzuki-mobile", version = "0.8.1" }
dotzuki-engine = { path = "../dotzuki-engine", version = "0.8.1" }
dotzuki-renderer = { path = "../dotzuki-renderer", version = "0.8.1", default-features = false, features = ["image-assets"] }
dotzuki-runner = { path = "../dotzuki-runner", version = "0.8.1", default-features = false }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = { workspace = true }
