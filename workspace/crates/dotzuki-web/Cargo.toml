[package]
name = "dotzuki-web"
version.workspace = true
edition.workspace = true
description = "WASM layout-preview bridge for the dotzuki JRPG engine"
license.workspace = true
repository.workspace = true

# rlib is included alongside cdylib so the audio-render logic can be unit-tested
# natively (`cargo test -p dotzuki-web`); wasm-pack still consumes the cdylib.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dotzuki-renderer = { path = "../dotzuki-renderer", version = "0.1.1" }
dotzuki-engine = { path = "../dotzuki-engine", version = "0.1.1" }
dotzuki-ui = { path = "../dotzuki-ui", version = "0.1.1" }
dotzuki-engine-dsl = { path = "../dotzuki-engine-dsl", version = "0.1.1" }
dotzuki-audio = { path = "../dotzuki-audio", version = "0.1.1", features = ["serde"] }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = []
debug-panic-hook = ["dep:console_error_panic_hook"]
# Real file audio (WAV/OGG/FLAC/MP3) playback bridge — forwarded to
# dotzuki-audio's `modern-audio`; off by default so the WASM bundle stays
# small for projects that only edit chiptune TrackDef JSON.
modern-audio = ["dotzuki-audio/modern-audio"]
