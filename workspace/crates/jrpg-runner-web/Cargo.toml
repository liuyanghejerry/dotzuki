[package]
name = "jrpg-runner-web"
version.workspace = true
edition.workspace = true
description = "wasm-bindgen shell that embeds jrpg-runner's RunnerGame in the browser editor for in-page playtests"
license.workspace = true

# rlib is included alongside cdylib so the wrapper can be unit-tested
# natively (`cargo test -p jrpg-runner-web`); wasm-pack still consumes the cdylib.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jrpg-runner = { path = "../jrpg-runner", default-features = false }
jrpg-renderer = { path = "../jrpg-renderer", default-features = false, features = ["image-assets"] }
jrpg-engine = { path = "../jrpg-engine" }
wasm-bindgen = "0.2"
serde_json = "1"
# Same version as jrpg-engine-dsl's base64 (features unify workspace-wide).
base64 = "0.22"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = []
debug-panic-hook = ["dep:console_error_panic_hook"]

[dev-dependencies]
# Generates the fixture project's tileset.png in tests (same recipe as
# jrpg-runner's tests/fixture.rs).
image = { version = "0.25", default-features = false, features = ["png"] }
