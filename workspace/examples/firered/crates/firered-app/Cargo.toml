[package]
name = "firered-app"
version.workspace = true
edition.workspace = true
description = "FireRed/LeafGreen color demo app — showcases GBA-style 16-color rendering"

[dependencies]
firered-data = { path = "../firered-data" }
dotzuki-engine = { path = "../../../../crates/dotzuki-engine" }
dotzuki-renderer = { path = "../../../../crates/dotzuki-renderer" }
dotzuki-app = { path = "../../../../crates/dotzuki-app" }
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
