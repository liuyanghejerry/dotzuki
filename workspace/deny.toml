[advisories]
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "Indirect Boa/wgpu/ratatui dependency; no safe paste upgrade is available." },
  { id = "RUSTSEC-2026-0192", reason = "Indirect winit Linux decoration dependency; no safe ttf-parser upgrade is available." },
  { id = "RUSTSEC-2026-0194", reason = "quick-xml is a Wayland build-time parser pinned by winit; project TMX parsing uses serde_json, not quick-xml." },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml NsReader is only an indirect Wayland build dependency and does not parse project input." },
]

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
