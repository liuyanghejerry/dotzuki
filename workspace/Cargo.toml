[workspace]
resolver = "2"
members = [
    "crates/jrpg-engine",
    "crates/jrpg-rules",
    "crates/jrpg-rules-macro",
    "crates/jrpg-engine-tiled",
    "crates/jrpg-engine-dsl",
    "crates/jrpg-engine-script",
    "crates/jrpg-cli",
    "crates/jrpg-runner",
    "crates/jrpg-runner-web",
    "crates/jrpg-renderer",
    "crates/jrpg-tui",
    "crates/jrpg-ui",
    "crates/jrpg-audio",
    "crates/jrpg-web",
    "crates/jrpg-app",
    "examples/firered/crates/firered-data",
    "examples/firered/crates/firered-app",
    "examples/minimon",
    "run-wasm",
]

# cargo-generate starter template: its Cargo.toml uses {{project-name}}
# placeholders and must not be parsed as a workspace package (which also
# breaks consumers that fetch this repo as a git dependency).
exclude = ["jrpg-template"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8"
bincode = "1"
thiserror = "2"
miette = { version = "7", features = ["fancy"] }
anyhow = "1"
tracing = "0.1"
notify = "6"
rand = "0.8"
strum = { version = "0.26", features = ["derive"] }
strum_macros = "0.26"
num-derive = "0.4"
num-traits = "0.2"
