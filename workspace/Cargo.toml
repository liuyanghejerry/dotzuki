[workspace]
resolver = "2"
members = [
    "crates/dotzuki-engine",
    "crates/dotzuki-rules",
    "crates/dotzuki-rules-macro",
    "crates/dotzuki-engine-tiled",
    "crates/dotzuki-engine-dsl",
    "crates/dotzuki-engine-script",
    "crates/dotzuki-cli",
    "crates/dotzuki-runner",
    "crates/dotzuki-runner-web",
    "crates/dotzuki-runner-mobile",
    "crates/dotzuki-mobile",
    "crates/dotzuki-renderer",
    "crates/dotzuki-tui",
    "crates/dotzuki-ui",
    "crates/dotzuki-audio",
    "crates/dotzuki-web",
    "crates/dotzuki-app",
    "examples/minimon",
    "run-wasm",
]

# cargo-generate starter template. Its manifest is Cargo.toml.liquid so Cargo
# does not parse the project-name template token when this repository is used
# as a git dependency; cargo-generate emits Cargo.toml in generated projects.
exclude = ["dotzuki-template"]

[workspace.package]
version = "0.8.2"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/liuyanghejerry/dotzuki"

[workspace.dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
log = { version = "0.4", default-features = false }
ron = "0.8"
bincode = "1"
thiserror = { version = "2", default-features = false }
miette = { version = "7", features = ["fancy"] }
anyhow = "1"
tracing = "0.1"
notify = "6"
rand = "0.8"
strum = { version = "0.26", features = ["derive"] }
strum_macros = "0.26"
num-derive = "0.4"
num-traits = "0.2"
