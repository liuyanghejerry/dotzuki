name: Release Editor (Electron apps)

# Packages the dotzuki-editor desktop app and attaches the installers to the
# GitHub Release — the Editor half of a `vX.Y.Z` release (the crates.io half
# lives in release.yml, driven by the same tag).
#
# Artifacts:
#   - macOS: Dotzuki Editor-<version>-{arm64,x64}.dmg / .zip (unsigned)
#   - Windows: Dotzuki Editor Setup <version>.exe (nsis, unsigned)
#
# The version is taken from [workspace.package] version in workspace/Cargo.toml
# (the single version source) — on tag pushes/release events it must match the
# tag, exactly like publish-crates.sh asserts. Code signing/notarization stays
# off (electron-builder.cjs switches on when cert env vars are provided).

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      preview:
        description: 'Publish an unofficial editor prerelease from the selected branch (no crates.io publish)'
        required: false
        default: false
        type: boolean
      tag:
        description: 'Release tag to attach to (default: workspace version, e.g. v0.1.1). Must match the workspace version of the checked-out ref — you cannot back-fill an older tag this way.'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ inputs.preview && format('release-editor-preview-{0}', github.ref) || 'release-editor' }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      preview: ${{ steps.metadata.outputs.preview }}
      release_exists: ${{ steps.metadata.outputs.release_exists }}
    steps:
      - uses: actions/checkout@v5
      - name: Resolve and validate release metadata before building
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW: ${{ inputs.preview || false }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: python3 workspace/scripts/editor-release.py

  # Build platform-independent release resources on Linux and hand them to both
  # packaging jobs. The dotzuki CLI + player binaries below are built on each
  # packaging runner because they are native executables.
  build-wasm:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain (wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: workspace

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: workspace/tools/pnpm-lock.yaml

      - name: Install dotzuki-editor dependencies
        # Install from the pnpm workspace root — that is where the committed
        # lockfile lives. Electron's binary is skipped: this job only compiles
        # WASM; the packaging jobs install it for real.
        working-directory: workspace/tools
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      - name: Build WASM packages
        # :release variants (wasm-pack --release) — these end up inside the
        # installers users download; the plain build:wasm scripts are --dev
        # (debug asserts, much larger) for local iteration.
        working-directory: workspace/tools/dotzuki-editor
        run: |
          pnpm run build:wasm:release
          pnpm run build:wasm-runner:release

      - name: Upload WASM packages
        uses: actions/upload-artifact@v4
        with:
          name: wasm-pkgs
          if-no-files-found: error
          path: |
            workspace/crates/dotzuki-web/pkg
            workspace/crates/dotzuki-web/pkg-node
            workspace/crates/dotzuki-runner-web/pkg

  build-android-runtime:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain (Android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Legacy SDK "tools" is no longer in the Android repository.
          packages: platform-tools

      - name: Install Android NDK
        run: sdkmanager "ndk;27.0.12077973"

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: workspace
          key: android-mobile-runtime

      - name: Build Android mobile runtime
        working-directory: workspace
        run: |
          NDK_BIN="$ANDROID_SDK_ROOT/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android26-clang" \
          AR_aarch64_linux_android="$NDK_BIN/llvm-ar" \
            cargo build --release --target aarch64-linux-android -p dotzuki-runner-mobile

      - name: Upload Android mobile runtime
        uses: actions/upload-artifact@v4
        with:
          name: android-mobile-runtime
          if-no-files-found: error
          path: workspace/target/aarch64-linux-android/release/libdotzuki_runner_mobile.a

  # Package the editor on each native platform (electron-builder cannot
  # cross-build dmg/nsis from Linux). Downloads the prebuilt WASM packages so
  # the packaged app ships the layout preview + playtest runner, and builds the
  # dotzuki CLI + player binaries natively so /api/export works in the app.
  build-app:
    needs: [prepare, build-wasm, build-android-runtime]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build_args: '--x64 --arm64'
            artifact_name: editor-dist-macos
          - os: windows-latest
            build_args: '--x64'
            artifact_name: editor-dist-windows
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: workspace/tools/pnpm-lock.yaml

      - name: Install dotzuki-editor dependencies
        working-directory: workspace/tools
        env:
          # .npmrc in this folder points Electron downloads at the npmmirror
          # (China mirror) for local networks; hosted runners are in the US,
          # where the canonical sources are faster and more reliable.
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
        run: pnpm install --frozen-lockfile

      - name: Download prebuilt WASM packages
        # Restores the in-repo pkg layout (workspace/crates/…), which
        # electron/stage-resources.mjs reads directly. upload-artifact v4
        # roots the artifact at the least-common-ancestor of the uploaded
        # paths (workspace/crates), so download into workspace/crates with
        # merge-multiple to strip the single-artifact wrapper dir.
        uses: actions/download-artifact@v4
        with:
          name: wasm-pkgs
          path: workspace/crates
          merge-multiple: true

      - name: Verify WASM packages landed in the repo layout
        # stage-resources.mjs degrades silently when a pkg is missing (a
        # near-empty dir + warning), so assert the layout here instead of
        # shipping installers without the layout preview / playtest runner.
        shell: bash
        run: |
          status=0
          for f in \
            workspace/crates/dotzuki-web/pkg/dotzuki_web.js \
            workspace/crates/dotzuki-web/pkg/dotzuki_web_bg.wasm \
            workspace/crates/dotzuki-web/pkg-node/dotzuki_web.js \
            workspace/crates/dotzuki-web/pkg-node/dotzuki_web_bg.wasm \
            workspace/crates/dotzuki-runner-web/pkg/dotzuki_runner_web.js \
            workspace/crates/dotzuki-runner-web/pkg/dotzuki_runner_web_bg.wasm; do
            [ -f "$f" ] || { echo "ERROR: missing $f — WASM artifact layout mismatch"; status=1; }
          done
          exit $status

      - name: Download Android mobile runtime
        uses: actions/download-artifact@v4
        with:
          name: android-mobile-runtime
          path: workspace/target/aarch64-linux-android/release

      - name: Verify Android mobile runtime
        shell: bash
        run: test -f workspace/target/aarch64-linux-android/release/libdotzuki_runner_mobile.a

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: workspace

      - name: Build dotzuki CLI + player binaries
        # The packaged editor shells out to these for /api/export (staged into
        # Resources/cli). macOS packages x64+arm64 in ONE electron-builder run,
        # so build both arches and lipo universal binaries into target/release,
        # where stage-resources.mjs reads them. Windows (--x64) needs only the
        # host build.
        working-directory: workspace
        shell: bash
        run: |
          PKGS="-p dotzuki-cli --bin dotzuki -p dotzuki-runner --bin dotzuki-player"
          cargo build --release $PKGS
          if [ "${{ runner.os }}" = "macOS" ]; then
            OTHER=x86_64-apple-darwin
            [ "$(uname -m)" = "x86_64" ] && OTHER=aarch64-apple-darwin
            rustup target add "$OTHER"
            cargo build --release --target "$OTHER" $PKGS
            for bin in dotzuki dotzuki-player; do
              lipo -create "target/release/$bin" "target/$OTHER/release/$bin" -output "target/release/$bin"
            done
            file target/release/dotzuki target/release/dotzuki-player
          fi

      - name: Sync editor version with release metadata
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # Version was validated before any builds started.
          node -e '
            const fs = require("fs")
            const p = "workspace/tools/dotzuki-editor/package.json"
            const j = JSON.parse(fs.readFileSync(p, "utf8"))
            j.version = process.argv[1]
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n")
            console.log(`editor package.json version → ${j.version}`)
          ' "$VERSION"

      - name: Package (electron-builder)
        # electron:dist = build:renderer + build:server + build:resources +
        # electron-builder; call electron-builder directly (instead of
        # `pnpm run electron:dist -- <args>`) because pnpm passes a literal
        # `--` through to the script, which electron-builder rejects.
        # --publish never: uploading to the GitHub Release is the explicit
        # `publish` job's job, not electron-builder's (it auto-publishes when
        # a GH_TOKEN is present). CSC_IDENTITY_AUTO_DISCOVERY=false keeps the
        # no-cert CI runner from probing the keychain for a signing identity
        # (electron-builder.cjs deliberately skips signing without cert envs).
        working-directory: workspace/tools/dotzuki-editor
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          pnpm run electron:build
          pnpm exec electron-builder --config electron-builder.cjs --publish never ${{ matrix.build_args }}

      - name: Upload distributables
        # Single-level globs on purpose: electron-builder also leaves the
        # unpacked app under release/win-unpacked/ (a bare ~100MB
        # "Dotzuki Editor.exe"), and ** would sweep it into the artifact —
        # and from there onto the Release. Installers land at the output root.
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: |
            workspace/tools/dotzuki-editor/release/*.dmg
            workspace/tools/dotzuki-editor/release/*.zip
            workspace/tools/dotzuki-editor/release/*.exe

  # Attach the installers to the GitHub Release. The release may not exist yet
  # (tag push); action-gh-release creates it, or updates an existing one.
  publish:
    needs: [prepare, build-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Write preview provenance
        if: needs.prepare.outputs.preview == 'true'
        env:
          SOURCE_REF: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          printf 'Unofficial editor preview for testing.\n\nSource: `%s` at `%s`.\n\nIncludes macOS and Windows installers. No crates.io packages are published.\n' "$SOURCE_REF" "$SOURCE_SHA" > preview-notes.md

      - name: Download distributables
        # Only the two platform distributable artifacts. WASM packages and the
        # Android runtime are intermediate artifacts already embedded in them.
        uses: actions/download-artifact@v4
        with:
          pattern: editor-dist-*
          path: artifacts
          merge-multiple: true

      - name: Create/update GitHub Release with editor apps
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.prepare.outputs.preview == 'true' }}
          make_latest: ${{ needs.prepare.outputs.preview == 'true' && 'false' || 'legacy' }}
          body_path: ${{ needs.prepare.outputs.preview == 'true' && 'preview-notes.md' || '' }}
          # Auto notes only when the Release is first created; on updates
          # (re-runs, duplicate tag-push + release-published triggers) keep
          # whatever notes are already there.
          generate_release_notes: ${{ needs.prepare.outputs.preview != 'true' && needs.prepare.outputs.release_exists == 'false' }}
          files: |
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.exe
