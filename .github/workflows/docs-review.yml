# AI documentation gate, powered by Clausura
# (https://github.com/liuyanghejerry/Clausura).
#
# Every docs change is reviewed against workspace/docs/doc-standard.md by a
# bounded LLM agent (skill: .clausura/skills/docs-review/SKILL.md), and the
# findings are evaluated by deterministic gating rules (.clausura.yaml):
# any error-severity violation fails the check.
#
# The review runs as a dynamic matrix, ONE AGENT RUN PER CHANGED FILE: a
# prepare job lists the changed .md files, and each file gets its own
# bounded diff (50KB cap) and its own agent run. Area-level chunking was
# still too large for the biggest files (the reference and how-to legs of
# the docs migration exhausted the agent loop), so the chunk unit is now
# the file itself. Files with no changes do not spawn a leg.
#
# Configuration (repo settings):
#   secrets.CLAUSURA_API_KEY   LLM API key. Missing -> the gate is skipped
#                              with a warning (never blocks).
#   vars.CLAUSURA_MODEL        Optional model override (default in .clausura.yaml).
#
# Escape hatch: label a PR `docs-ai-skip` to bypass the gate entirely.
# The meta-docs (doc-standard.md / doc-outline.md) are exempt from review —
# they are the ruleset, not user-facing pages (doc-standard §6.5).
#
# NOTE: we deliberately do NOT use the liuyanghejerry/Clausura@v1 composite
# action here. It always exports its `model`/`vendor` inputs as env vars,
# and an empty-but-set CLAUSURA_MODEL/CLAUSURA_VENDOR overrides the values
# from .clausura.yaml (the empty vendor resolves to api.openai.com). The
# step below unsets empty overrides before running so the YAML config wins.

name: docs-ai-review

on:
  push:
    branches: [ master ]
    paths:
      - 'workspace/docs/**'
      - 'README.md'
      - '.clausura.yaml'
      - '.clausura/**'
      - '.github/workflows/docs-review.yml'
  pull_request:
    paths:
      - 'workspace/docs/**'
      - 'README.md'
      - '.clausura.yaml'
      - '.clausura/**'
      - '.github/workflows/docs-review.yml'
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    # Labels only exist on pull_request events; contains() on an empty list
    # is false, so pushes run normally.
    if: ${{ github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'docs-ai-skip') }}
    permissions:
      contents: read
    outputs:
      files: ${{ steps.list.outputs.files }}
      count: ${{ steps.list.outputs.count }}
      has_key: ${{ steps.key.outputs.configured }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check API key configured
        id: key
        env:
          KEY: ${{ secrets.CLAUSURA_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: List changed docs files
        id: list
        if: steps.key.outputs.configured == 'true'
        env:
          REVIEW_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          BASE="${REVIEW_BASE:-origin/master}"
          MB="$(git merge-base "$BASE" HEAD 2>/dev/null || true)"
          [ -n "$MB" ] && BASE="$MB"
          git diff --name-only "$BASE" HEAD -- workspace/docs README.md > /tmp/changed.txt || true
          # Review scope: markdown under workspace/docs plus the root README.
          # Exempt: the meta-docs (they are the ruleset) and archive/ (historical,
          # not maintained — reviewing moved legacy content produces false
          # positives against rules it predates).
          grep -E '\.md$' /tmp/changed.txt | grep -vE '^workspace/docs/(doc-standard|doc-outline)\.md$|^workspace/docs/archive/' > /tmp/scope.txt || true
          # Deleted files have no content to review; the legs of the changed
          # files check their referrers (the DSL_MAPPING leg of PR #9 did
          # catch a dead link in dsl-demo.html this way, so the signal is not
          # lost — it just lives in the surviving files' reviews).
          while read -r f; do [ -f "$f" ] && echo "$f"; done < /tmp/scope.txt > /tmp/scope-existing.txt
          mv /tmp/scope-existing.txt /tmp/scope.txt
          COUNT="$(wc -l < /tmp/scope.txt | tr -d ' ')"
          FILES="$(jq -Rsc '{files: split("\n")[:-1]}' /tmp/scope.txt)"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "changed files ($COUNT):"
          cat /tmp/scope.txt

      - name: Notice (gate not enabled)
        if: steps.key.outputs.configured == 'false'
        run: |
          echo "::warning::docs-ai-review is disabled: set the CLAUSURA_API_KEY repo secret to enable the AI gate."

  review:
    needs: prepare
    if: ${{ needs.prepare.outputs.has_key == 'true' && needs.prepare.outputs.count != '0' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one file failing must not cancel the others
      matrix: ${{ fromJson(needs.prepare.outputs.files) }}
    concurrency:
      group: docs-ai-review-${{ github.event.pull_request.number || github.run_id }}-${{ matrix.files }}
      cancel-in-progress: true
    permissions:
      contents: read
      security-events: write # SARIF upload to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare review diff (${{ matrix.files }})
        id: prepare
        env:
          REVIEW_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          BASE="${REVIEW_BASE:-origin/master}"
          MB="$(git merge-base "$BASE" HEAD 2>/dev/null || true)"
          [ -n "$MB" ] && BASE="$MB"
          mkdir -p .clausura/context
          git diff --unified=3 "$BASE" HEAD -- "${{ matrix.files }}" > .clausura/context/review-diff.txt
          # Cap at 50KB; the skill pages through truncation with offset/limit.
          head -c 51200 .clausura/context/review-diff.txt > .clausura/context/review-diff.tmp
          mv .clausura/context/review-diff.tmp .clausura/context/review-diff.txt
          echo "file=${{ matrix.files }} diff bytes: $(wc -c < .clausura/context/review-diff.txt)"

      - name: Install Clausura
        run: |
          curl -fsSL https://raw.githubusercontent.com/liuyanghejerry/Clausura/main/install.sh | bash
          # install.sh prefers /usr/local/bin and falls back to ~/.local/bin;
          # make sure the fallback location is on PATH.
          export PATH="$HOME/.local/bin:$PATH"
          clausura --version

      - name: Run docs gate (Clausura)
        env:
          CLAUSURA_API_KEY: ${{ secrets.CLAUSURA_API_KEY }}
          CLAUSURA_MODEL: ${{ vars.CLAUSURA_MODEL }}
        run: |
          # Unset empty overrides: Clausura treats a set-but-empty env var as
          # an override, which would blank out the model/vendor from YAML.
          [ -n "$CLAUSURA_MODEL" ] || unset CLAUSURA_MODEL
          clausura run --config .clausura.yaml

      - name: Upload SARIF findings
        # always(): keep the audit trail even when the gate fails.
        # continue-on-error: code scanning may be disabled on the repo.
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: clausura-output.sarif
