name: CI

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-rust-workspace:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -yq \
            build-essential \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libvulkan-dev \
            libasound2-dev \
            libudev-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        # rust-cache uses its own key namespace and prunes the target dir
        # before saving; the old actions/cache entries (ci-cargo-*) were
        # created by the self-hosted runner and grew to multiple GB, which
        # stalled the restore step on GitHub-hosted runners.
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: workspace

      - name: Build workspace
        working-directory: workspace
        run: cargo build --workspace

      - name: Test workspace
        working-directory: workspace
        run: cargo test --workspace

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: Coverage (cargo-llvm-cov)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -yq \
            build-essential \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libvulkan-dev \
            libasound2-dev \
            libudev-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Run coverage
        # Summary table goes to the job log; the lcov report is uploaded as
        # an artifact for inspection.
        working-directory: workspace
        run: |
          cargo llvm-cov --workspace --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: workspace/lcov.info
          retention-days: 30

  build-dotzuki-editor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: Build dotzuki-editor
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: workspace/tools/pnpm-lock.yaml

      - name: Install dotzuki-editor dependencies
        # Install from the pnpm workspace root — that is where the committed
        # lockfile lives.
        working-directory: workspace/tools
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: workspace/tools/dotzuki-editor
        run: npx vue-tsc --noEmit

      - name: Test
        working-directory: workspace/tools/dotzuki-editor
        run: npx vitest run

      - name: Build
        working-directory: workspace/tools/dotzuki-editor
        run: pnpm run build
