name: CI

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      # Workflow-only changes (this file, docs-pages.yml, …) must not run
      # the full suite: GitHub parses every workflow's YAML on push anyway,
      # and `workflow_dispatch` remains for manual re-runs.
      - '.github/workflows/*'
  pull_request:
    paths-ignore:
      - '**.md'
      - '.github/workflows/*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-rust-workspace:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -yq \
            build-essential \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libvulkan-dev \
            libasound2-dev \
            libudev-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        # rust-cache uses its own key namespace and prunes the target dir
        # before saving; the old actions/cache entries (ci-cargo-*) were
        # created by the self-hosted runner and grew to multiple GB, which
        # stalled the restore step on GitHub-hosted runners.
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: workspace

      - name: Build workspace
        working-directory: workspace
        run: cargo build --workspace

      - name: Test workspace
        working-directory: workspace
        run: cargo test --workspace

      - name: Smoke-run the tutorial project
        working-directory: workspace
        run: |
          # M3: the zero-Rust tutorial project (examples/your-first-game)
          # must compile-check and boot headless — the walkthrough target
          # of tutorials/your-first-game.md.
          ./target/debug/dotzuki check examples/your-first-game
          ./target/debug/dotzuki run examples/your-first-game --headless --frames 180

  gba-frame-budget:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: GBA frame budget (59.7275 Hz)
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install mGBA build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yq \
            build-essential \
            clang \
            cmake \
            curl \
            libclang-dev \
            libelf-dev \
            pkg-config

      - name: Install pinned GBA Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2025-12-06
          components: rust-src

      - name: Cache GBA cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: workspace/ci/gba-frame-budget
          key: gba-frame-budget

      # The pinned runner embeds mGBA 0.10.5. It executes ARM7TDMI code and
      # reports emulated GBA master-clock cycles, so host load cannot make the
      # performance threshold flaky.
      - name: Install mGBA test runner
        # agb v0.25.0, pinned to the peeled commit so a moved tag cannot alter
        # the emulator or its cycle model.
        run: >-
          cargo install --git https://github.com/agbrs/agb.git
          --rev 1c2842c954fe1dd40a4b0ce0fbecf4ab7157745a
          --locked mgba-test-runner

      # One 59.7275 Hz frame is exactly 280,896 GBA master-clock cycles. The
      # ROM asserts representative redraw and screen-effect frames stay below
      # that budget; exceeding it fails this required CI job.
      - name: Enforce GBA frame budget
        working-directory: workspace/ci/gba-frame-budget
        run: cargo test --release --locked

  build-android-export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: Build Android export
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yq pkg-config libasound2-dev

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.0.12077973"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: workspace
          key: android-export

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build runtime and export tutorial project
        working-directory: workspace
        run: |
          NDK_BIN="$ANDROID_SDK_ROOT/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android26-clang" \
          AR_aarch64_linux_android="$NDK_BIN/llvm-ar" \
            cargo build --release --target aarch64-linux-android -p dotzuki-runner-mobile
          cargo build -p dotzuki-cli
          ./target/debug/dotzuki export --android examples/your-first-game \
            --mobile-lib target/aarch64-linux-android/release/libdotzuki_runner_mobile.a \
            --out target/android-export-ci

      - name: Assemble exported Android app
        working-directory: workspace
        run: gradle --project-dir target/android-export-ci assembleDebug --no-daemon

  package-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: Package check (crates.io release gate)
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Runs scripts/publish-crates.sh --check: the version-consistency gate
      # plus `cargo package` for every publishable crate. Catches manifest
      # drift (missing dep versions, out-of-sync workspace version) on PRs
      # instead of mid-release.
      - name: Check crates package cleanly
        working-directory: workspace
        run: bash scripts/publish-crates.sh --check

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: Coverage (cargo-llvm-cov)
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -yq \
            build-essential \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libvulkan-dev \
            libasound2-dev \
            libudev-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Run coverage
        # Summary table goes to the job log; the lcov report is uploaded as
        # an artifact for inspection.
        working-directory: workspace
        run: |
          cargo llvm-cov --workspace --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: workspace/lcov.info
          retention-days: 30

  build-dotzuki-editor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: Build dotzuki-editor
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: workspace/tools/pnpm-lock.yaml

      - name: Install dotzuki-editor dependencies
        # Install from the pnpm workspace root — that is where the committed
        # lockfile lives.
        working-directory: workspace/tools
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: workspace/tools/dotzuki-editor
        run: npx vue-tsc --noEmit

      - name: Test
        working-directory: workspace/tools/dotzuki-editor
        run: npx vitest run

      - name: Build
        working-directory: workspace/tools/dotzuki-editor
        run: pnpm run build
