name: Release (crates.io)

# Publishes the dotzuki-* crates to crates.io, driven by a version tag or a
# GitHub Release. The publish script is idempotent: crates whose version is
# already on crates.io are skipped, so duplicate triggers (tag push + release
# published) and re-runs after a partial failure are safe.
#
# One release rule: the tag must name the workspace version. A `v0.1.0` tag
# publishes every dotzuki-* crate at 0.1.0 (they all inherit
# [workspace.package] version in workspace/Cargo.toml).

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# Tag push and "release published" can both fire for one release — serialize
# them so the second run simply skips what the first already published.
concurrency:
  group: release-crates-io
  cancel-in-progress: false

jobs:
  publish:
    name: Publish dotzuki crates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The publish script verifies each packaged crate by building it, and the
      # default `gpu` feature pulls in winit/pixels — same native deps as CI.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -yq \
            build-essential \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libvulkan-dev \
            libasound2-dev \
            libudev-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish crates to crates.io
        working-directory: workspace
        env:
          # Repo secret (Settings → Secrets and variables → Actions).
          # Create one at https://crates.io/settings/tokens/new (scopes:
          # publish-update for existing crates; publish-new for first releases).
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          # On tag pushes and release events the ref is the version tag, which
          # the script asserts against the workspace version. On manual runs
          # the ref is a branch, so no assertion.
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: bash scripts/publish-crates.sh
